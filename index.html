<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#282B4A" />
    <meta
      name="description"
      content="University Connect bridges students, alumni, campus communities, student projects, and hackathons across one unified network."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>University Connect | Campus &amp; Alumni Network</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('uc-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
